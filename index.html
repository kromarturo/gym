<script>
// ================= geometry =================
const R=Math.PI/180, dir=a=>[Math.sin(a*R),Math.cos(a*R)], add=(p,v,k=1)=>[p[0]+v[0]*k,p[1]+v[1]*k];
const FY=226, BENCH=193;
function IK(P,T,L1,L2,b){
  let dx=T[0]-P[0],dy=T[1]-P[1],d=Math.hypot(dx,dy)||1e-3;const ux=dx/d,uy=dy/d;
  d=Math.min(Math.max(d,Math.abs(L1-L2)+0.5),L1+L2-0.3);
  const a=Math.acos(Math.max(-1,Math.min(1,(L1*L1+d*d-L2*L2)/(2*L1*d)))),base=Math.atan2(uy,ux);
  const c=[base+a,base-a].map(q=>[P[0]+L1*Math.cos(q),P[1]+L1*Math.sin(q)]);
  const dot=m=>(m[0]-P[0])*b[0]+(m[1]-P[1])*b[1];
  return [dot(c[0])>=dot(c[1])?c[0]:c[1],[P[0]+ux*d,P[1]+uy*d]];
}
const SIDE_DEF={t:180,th:0,sh:0,ft:90,u:0,f:0,c:0,shr:0,hx:0,dy:0,ue:1,fe:1,ae:1};
function fullSide(p){
  const q=Object.assign({},SIDE_DEF,p);
  if(p.h===undefined)q.h=q.t;
  for(const k of["th","sh","ft","u","f","ue","fe"]) if(p[k+"2"]===undefined) q[k+"2"]=q[k];
  if(p.k1&&!p.k2)q.k2=p.k1; if(p.w1&&!p.w2)q.w2=p.w1; if(p.e1&&!p.e2)q.e2=p.e1;
  return q;
}
function side(p,ex){
  const J={},hip=[0,p.dy],d=dir(p.t);
  J.hip=hip;J.sho0=add(hip,d,58);J.sho=add(J.sho0,d,6*p.shr);
  J.head=add(add(J.sho0,dir(p.h),21),[p.hx,0]);
  const legL=(n,s)=>{if(!p["k"+n]){J["knee"+s]=add(hip,dir(p["th"+s]),46);J["ank"+s]=add(J["knee"+s],dir(p["sh"+s]),44);J["toe"+s]=add(J["ank"+s],dir(p["ft"+s]),16);}};
  legL(1,"");legL(2,"2");
  const rel=ex.armRel?p.t-180:0;
  const armL=(n,s)=>{if(!p["w"+n]&&!p["e"+n]){J["elb"+s]=add(J.sho,dir(p["u"+s]+rel),32*p["ue"+s]);J["wri"+s]=add(J["elb"+s],dir(p["f"+s]+rel),30*p["fe"+s]);}};
  armL(1,"");armL(2,"2");
  const pin=ex.pin[0],pt=ex.pin[1],o=[pt[0]-J[pin][0],pt[1]-J[pin][1]];
  for(const k in J)J[k]=add(J[k],o);
  const ik=(n,s)=>{if(p["k"+n]){const r=IK(J.hip,p["k"+n],46,44,ex.kb||[1,0]);J["knee"+s]=r[0];J["ank"+s]=r[1];J["toe"+s]=add(r[1],dir(p["ft"+s]),16);}
    if(p["w"+n]){const r=IK(J.sho,p["w"+n],32*p.ae,30*p.ae,p.wb||ex.wb||[-0.3,1]);J["elb"+s]=r[0];J["wri"+s]=r[1];}
    if(p["e"+n]){J["elb"+s]=p["e"+n];J["wri"+s]=add(p["e"+n],dir(p["f"+s]+rel),30*p["fe"+s]);}};
  ik(1,"");ik(2,"2");
  J.face=add(J.head,dir(ex.sup?p.h+90:p.h-90),7);
  return J;
}
const FRONT_DEF={tl:0,uR:6,eR:1,lR:5,shrR:0,dy:0,leR:1,keR:1,te:1};
function fullFront(p){
  const q=Object.assign({},FRONT_DEF,p);
  if(p.fR===undefined)q.fR=q.uR; if(p.uL===undefined)q.uL=q.uR; if(p.fL===undefined)q.fL=p.uL===undefined?q.fR:q.uL;
  if(p.eL===undefined)q.eL=q.eR; if(p.feR===undefined)q.feR=q.eR; if(p.feL===undefined)q.feL=p.eL===undefined?q.feR:q.eL;
  if(p.kR===undefined)q.kR=q.lR; if(p.lL===undefined)q.lL=q.lR; if(p.kL===undefined)q.kL=p.lL===undefined?q.kR:q.lL;
  if(p.leL===undefined)q.leL=q.leR; if(p.keL===undefined)q.keL=q.keR;
  if(p.shrL===undefined)q.shrL=q.shrR; return q;
}
function front(p,ex){
  const J={},hip=[0,p.dy],up=[Math.sin(p.tl*R),-Math.cos(p.tl*R)],sd=[Math.cos(p.tl*R),Math.sin(p.tl*R)];
  J.hip=hip;J.neck=add(hip,up,60*p.te);J.head=add(J.neck,up,19);
  J.shoR=add(add(J.neck,sd,19),[0,-6*p.shrR]);J.shoL=add(add(J.neck,sd,-19),[0,-6*p.shrL]);
  J.hipR=add(hip,sd,9);J.hipL=add(hip,sd,-9);
  const a=(s,sg)=>{if(!p.wR){const u=p["u"+s],f=p["f"+s];J["elb"+s]=add(J["sho"+s],[sg*Math.sin(u*R),Math.cos(u*R)],32*p["e"+s]);J["wri"+s]=add(J["elb"+s],[sg*Math.sin(f*R),Math.cos(f*R)],30*p["fe"+s]);}
    J["knee"+s]=add(J["hip"+s],[sg*Math.sin(p["l"+s]*R),Math.cos(p["l"+s]*R)],46*p["le"+s]);J["ank"+s]=add(J["knee"+s],[sg*Math.sin(p["k"+s]*R),Math.cos(p["k"+s]*R)],44*p["ke"+s]);};
  a("R",1);a("L",-1);
  const pj=ex.pinJ;const o=[ex.pin[0]-J.hip[0],ex.pin[1]-(pj?J[pj][1]:Math.max(J.ankR[1],J.ankL[1]))];
  for(const k in J)J[k]=add(J[k],o);
  if(p.wR){const eb=p.ebR||[1,0];let r=IK(J.shoR,p.wR,32*p.eR,30*p.eR,eb);J.elbR=r[0];J.wriR=r[1];
    const wl=p.wL||[2*J.hip[0]-p.wR[0],p.wR[1]];r=IK(J.shoL,wl,32*p.eL,30*p.eL,p.ebL||[-eb[0],eb[1]]);J.elbL=r[0];J.wriL=r[1];}
  return J;
}
// ================= drawing =================
const f1=n=>(+n).toFixed(1);
const G={
  ln:(a,b,c,w,op=1,dash="")=>`<line x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}" stroke="var(--${c})" stroke-width="${w}" stroke-linecap="round" opacity="${op}"${dash?` stroke-dasharray="${dash}"`:""}/>`,
  ci:(p,r,c,op=1)=>`<circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="${r}" fill="var(--${c})" opacity="${op}"/>`,
  re:(x,y,w,h,c,op=1,rx=2)=>`<rect x="${f1(x)}" y="${f1(y)}" width="${f1(Math.max(0,w))}" height="${f1(Math.max(0,h))}" rx="${rx}" fill="var(--${c})" opacity="${op}"/>`,
  tx:(x,y,s,c,sz=11,anc="middle")=>`<text x="${x}" y="${y}" fill="var(--${c})" font-size="${sz}" font-family="IBM Plex Mono,monospace" text-anchor="${anc}" font-weight="600">${s}</text>`,
  floor:()=>G.ln([6,FY+4],[294,FY+4],"floorc",3),
  mat:(x1,x2)=>G.re(x1,FY,x2-x1,5,"body2",.45),
  db:p=>G.ci(p,8,"machine")+G.ci(p,3,"stage2"),
  dbH:p=>G.ln(add(p,[-9,0]),add(p,[9,0]),"machine",4)+G.re(p[0]-12,p[1]-6,5,12,"machine",1,1)+G.re(p[0]+7,p[1]-6,5,12,"machine",1,1),
  bench:(x1,x2,top=BENCH)=>G.re(x1,top,x2-x1,8,"machine",1,3)+G.re(x1+6,top+8,5,FY+4-top-8,"machine",.8,1)+G.re(x2-11,top+8,5,FY+4-top-8,"machine",.8,1),
  cable:(a,b)=>G.ln(a,b,"dim",1.2)+G.ci(a,5,"machine"),
  band:(a,b)=>G.ln(a,b,"band",3),
  anchor:p=>G.re(p[0]-5,p[1]-5,10,10,"machine",1,2),
  quad:(a,b,c,col,w)=>{const m=[(a[0]+b[0])/2,(a[1]+b[1])/2],dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1,n=[dy/L,-dx/L],q=add(m,n,2*c);
    return `<path d="M${f1(a[0])} ${f1(a[1])} Q${f1(q[0])} ${f1(q[1])} ${f1(b[0])} ${f1(b[1])}" stroke="var(--${col})" stroke-width="${w}" fill="none" stroke-linecap="round"/>`},
  note:(s,x=150)=>s?G.tx(x,18,s,"hl",11):""
};
// Corength frame silhouette in side view: rear upright, top beam (≈202 cm), base
G.tower=(x0,x1)=>G.ln([x0,FY],[x0,22],"machine",5,.6)+G.ln([x1,FY],[x1,22],"machine",5,.6)+G.ln([x0-8,22],[x1+8,22],"machine",6,.8)+G.tx((x0+x1)/2,14,"Strength Tower","dim",8);
G.corSide=(x0,x1,pul=[])=>G.ln([x0,FY+2],[x1,FY+2],"machine",5,.55)+G.ln([x0,FY],[x0,24],"machine",6,.55)+G.ln([x0,24],[x1,24],"machine",6,.55)+pul.map(p=>G.ci(p,5,"machine")).join("");
function drawSide(J,p,bad){
  const B=k=>bad.includes(k), col=(k,d)=>B(k)?"hl":d;
  let s="";
  s+=G.ln(J.hip,J.knee2,col("leg2","body2"),11)+G.ln(J.knee2,J.ank2,col("leg2","body2"),10)+G.ln(J.ank2,J.toe2,col("foot","body2"),6);
  s+=G.ln(J.sho,J.elb2,col("arm2","body2"),9)+G.ln(J.elb2,J.wri2,col("arm2","body2"),8);
  s+=G.quad(J.hip,J.sho0,p.c,col("torso","body"),15);
  s+=G.ln(J.sho0,J.sho,col("sho","body"),13);
  s+=G.ci(J.head,11,col("head","body"))+G.ci(J.face,2.2,"stage2");
  s+=G.ln(J.hip,J.knee,col("leg","body"),11)+G.ln(J.knee,J.ank,col("leg","body"),10)+G.ln(J.ank,J.toe,col("foot","body"),6);
  s+=G.ln(J.sho,J.elb,col("arm","body"),9)+G.ln(J.elb,J.wri,col("arm","body"),8);
  if(J.elb[1]<J.sho[1]-6)s+=G.ci(J.head,12.5,"stage2")+G.ci(J.head,11,col("head","body"))+G.ci(J.face,2.2,"stage2");
  return s;
}
function drawFront(J,p,bad,cfg={}){
  const B=k=>bad.includes(k), col=(k,d)=>B(k)?"hl":d;let s="";
  for(const S of["L","R"]){const lg=S==="R"?"leg":"leg2";s+=G.ln(J["hip"+S],J["knee"+S],col(lg,"body2"),11)+G.ln(J["knee"+S],J["ank"+S],col(lg,"body2"),10);}
  const arms=()=>{let a="";for(const S of["L","R"]){const k=S==="R"?"arm":"arm2";a+=G.ln(J["sho"+S],J["elb"+S],col(k,"body"),9)+G.ln(J["elb"+S],J["wri"+S],col(k,"body"),8);}return a};
  if(cfg.armsBehind)s+=arms();
  s+=`<path d="M${f1(J.shoR[0])} ${f1(J.shoR[1])} L${f1(J.shoL[0])} ${f1(J.shoL[1])} L${f1(J.hipL[0])} ${f1(J.hipL[1])} L${f1(J.hipR[0])} ${f1(J.hipR[1])}Z" fill="var(--${col("torso","body2")})" stroke="var(--${col("torso","body2")})" stroke-width="8" stroke-linejoin="round"/>`;
  s+=G.ln(J.neck,J.head,"body",8)+G.ci(J.head,12,col("head","body"));
  for(const S of["L","R"])s+=G.ci(J["sho"+S],7,col("sho","body"));
  if(!cfg.armsBehind)s+=arms();
  return s;
}
// top-view primitives: lifter seen from above, facing up the screen
function topBody(cx,cy,shr=0,bad=[]){
  const B=k=>bad.includes(k);
  return `<ellipse cx="${f1(cx)}" cy="${f1(cy+4)}" rx="27" ry="13" fill="var(--${B("torso")?"hl":"body2"})"/>`+G.ci([cx-20,cy],7,B("sho")?"hl":"body")+G.ci([cx+20,cy],7,B("sho")?"hl":"body")+G.ci([cx,cy-2-shr*4],12,B("head")?"hl":"body")+G.ci([cx,cy-12-shr*4],2.2,"stage2");
}
const tarm=(s,e,w,bad)=>G.ln(s,e,bad?"hl":"body",9)+G.ln(e,w,bad?"hl":"body",8);

  $("walk").querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{const i=+b.dataset.w;done=done.includes(i)?done.filter(x=>x!==i):[...done,i];try{localStorage.setItem(key,JSON.stringify(done))}catch(e){}b.setAttribute("aria-pressed",done.includes(i))});

<script>
(function(){
  const K="gymWeightLog";const $=id=>document.getElementById(id);const hd=document.querySelector("header");if(hd){hd.appendChild($("mfab"));hd.appendChild($("wfab"));}
  const load=()=>{try{return JSON.parse(localStorage.getItem(K)||"{}")}catch(e){return {}}};
  const save=d=>{try{localStorage.setItem(K,JSON.stringify(d));return true}catch(e){return false}};
  const today=()=>{const t=new Date();t.setMinutes(t.getMinutes()-t.getTimezoneOffset());return t.toISOString().slice(0,10)};
  const fmt=d=>new Date(d+"T12:00").toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
  const msg=t=>{$("wmsg").textContent=t};
  function draw(){
    const d=load(),ks=Object.keys(d).sort(),v=ks.map(x=>d[x]);
    const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
    const last7=ks.filter(x=>{const g=(new Date(today())-new Date(x))/864e5;return g>=0&&g<7}).map(x=>d[x]);
    const a7=avg(last7),first=v[0],lastv=v[v.length-1];

      $("wchart").innerHTML=`<svg viewBox="0 0 ${W} ${H}"><text x="${P}" y="${H-2}" font-size="9" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${fmt(ks[0])}</text><text x="${W-P}" y="${H-2}" font-size="9" fill="var(--muted)" text-anchor="end" font-family="IBM Plex Mono,monospace">${fmt(ks[ks.length-1])}</text><text x="${W-P}" y="${Y(hi)+3}" font-size="9" fill="var(--muted)" text-anchor="end" font-family="IBM Plex Mono,monospace">${hi.toFixed(1)}</text><text x="${W-P}" y="${Y(lo)-3}" font-size="9" fill="var(--muted)" text-anchor="end" font-family="IBM Plex Mono,monospace">${lo.toFixed(1)}</text><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>${ks.map((k,i)=>`<circle cx="${X(k).toFixed(1)}" cy="${Y(d[k]).toFixed(1)}" r="${i===ks.length-1?4:2.2}" fill="var(--accent)"/>`).join("")}</svg>`}
    $("wlist").innerHTML=ks.slice().reverse().map(k=>`<div class="wrow"><span class="d">${fmt(k)}</span><b>${d[k].toFixed(1)} kg</b><button data-del="${k}" aria-label="Delete ${k}">×</button></div>`).join("");
    $("wlist").querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
      if(b.dataset.armed){const x=load();delete x[b.dataset.del];const ok=save(x);draw();msg(ok?"Entry deleted.":"Couldn't delete: this browser is blocking storage.")}
      else{b.dataset.armed=1;b.textContent="Delete?";b.style.color="var(--bad)";setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent="×";b.style.color=""}},3000)}});
  }
  function open(){$("wsheet").hidden=false;$("wdate").value=today();$("wdate").max=today();const d=load();$("wkg").value=d[today()]!=null?d[today()]:"";draw();setTimeout(()=>$("wkg").focus(),50)}
  $("wfab").onclick=()=>{$("wsheet").hidden?open():($("wsheet").hidden=true)};
  $("wclose").onclick=()=>{$("wsheet").hidden=true};
  $("wdate").addEventListener("change",()=>{const d=load();$("wkg").value=d[$("wdate").value]??""});

    const d=load();d[$("wdate").value]=Math.round(kg*10)/10;msg(save(d)?`Saved ${kg.toFixed(1)} kg for ${fmt($("wdate").value)}.`:"Couldn't save: this browser is blocking storage (private mode?).");draw()});
  $("wexp").onclick=async()=>{const d=load(),t=Object.keys(d).sort().map(k=>k+","+d[k]).join("\n");
    try{await navigator.clipboard.writeText(t);msg("Copied. Paste it into Notes to keep a backup.")}catch(e){$("wio").hidden=false;$("wimp").value=t;$("wimp").select();msg("Select the text below and copy it.")}};

  $("wimpgo").onclick=()=>{const d=load();let n=0;$("wimp").value.split(/\n+/).forEach(l=>{const m=l.trim().match(/^(\d{4}-\d{2}-\d{2})[,;\s]+([\d.,]+)/);if(m){const kg=parseFloat(m[2].replace(",","."));if(kg>=20&&kg<=250){d[m[1]]=Math.round(kg*10)/10;n++}}});if(!n){msg("No lines matched. Use: 2026-11-06,57.2");return}const ok=save(d);draw();if(ok){$("wio").hidden=true;msg(`Imported ${n} entries.`)}else msg("Couldn't import: this browser is blocking storage.")};
